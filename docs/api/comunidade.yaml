openapi: 3.1.0
info:
  title: BEDARCE — Microsserviço de Comunidade
  version: 1.0.0
  description: Perfis de mentores, relatos, grupos de apoio, conversas e pedidos de apoio. Acesso externo por token Bearer
    e autorização por papel/participação; operações internas da SAGA usam credencial de serviço. O Gateway pode responder
    429 quando excede o rate limit; o BFF pode responder 503 quando uma dependência necessária fica indisponível, conforme
    a arquitetura descrita no README.
servers:
- url: /
  description: Origem configurada pelo ambiente para o microsserviço; os caminhos deste contrato incluem /v1.
tags:
- name: Mentores
- name: Relatos
- name: Grupos
- name: Usuarios
- name: Conversas
- name: Pedidos Apoio
- name: Internal
paths:
  /v1/mentores:
    get:
      tags:
      - Mentores
      summary: Listar mentores
      description: 'Acesso: Paciente e Administrador. Portal lista mentores ativos; administrador pode filtrar por situação.'
      operationId: getV1Mentores
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MentorPage'
        '401':
          description: Token ausente, inválido ou expirado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Não autenticado
                status: 401
                detail: Token ausente, inválido ou expirado.
                instance: /v1/mentores
                code: UNAUTHORIZED
      parameters:
      - name: situacao
        in: query
        required: false
        schema:
          type: string
        description: Filtro administrativo pela situação do mentor.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      x-bedarce-caller: bff-portal` e `bff-admin
  /v1/mentores/{usuarioId}:
