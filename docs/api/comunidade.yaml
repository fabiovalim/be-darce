components:
  schemas:
    Error:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
          example: about:blank
        title:
          type: string
          example: Requisição inválida
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Um ou mais campos são inválidos.
        instance:
          type: string
          format: uri-reference
          example: /v1/recursos
        code:
          type: string
          example: VALIDATION_ERROR
      additionalProperties: false
      required:
      - type
      - title
      - status
      - detail
    SituacaoMentor:
      type: string
      enum:
      - ATIVO
      - INATIVO
      - IMPEDIDO
      example: ATIVO
    Mentor:
      type: object
      properties:
        usuarioId:
          type: string
          example: u-31
        apelido:
          type: string
          example: Rafa
        descricao:
          type: string
          example: Ex-apostador em recuperação; compartilho minha experiência.
        situacao:
          $ref: '#/components/schemas/SituacaoMentor'
        criadoEm:
          type: string
          format: date-time
          example: '2026-08-01T10:00:00Z'
      additionalProperties: false
      required:
      - usuarioId
      - apelido
      - descricao
      - situacao
      example:
        usuarioId: u-31
        apelido: Rafa
        descricao: Ex-apostador em recuperação; compartilho minha experiência.
        situacao: ATIVO
        criadoEm: '2026-08-01T10:00:00Z'
    MentorPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Mentor'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
      additionalProperties: false
      required:
      - items
      - total
      - page
      - pageSize
      example:
        items:
        - usuarioId: u-31
          apelido: Rafa
          descricao: Compartilho minha experiência.
          situacao: ATIVO
        total: 1
        page: 1
        pageSize: 20
    MentorUpdateRequest:
      type: object
      properties:
        apelido:
          type: string
          maxLength: 80
          example: Rafa
        descricao:
          type: string
          maxLength: 1000
          example: Ex-apostador em recuperação; compartilho minha experiência.
      additionalProperties: false
      required:
      - apelido
      - descricao
      example:
        apelido: Rafa
        descricao: Ex-apostador em recuperação; compartilho minha experiência.
    StatusMentorRequest:
      type: object
      properties:
        situacao:
          $ref: '#/components/schemas/SituacaoMentor'
      additionalProperties: false
      required:
      - situacao
      example:
        situacao: ATIVO
    EstatisticasMentores:
      type: object
      properties:
        porSituacao:
          type: object
          properties:
            ATIVO:
              type: integer
              minimum: 0
              example: 8
            INATIVO:
              type: integer
              minimum: 0
              example: 2
            IMPEDIDO:
              type: integer
              minimum: 0
              example: 1
          additionalProperties: false
      additionalProperties: false
      required:
      - porSituacao
      example:
        porSituacao:
          ATIVO: 8
          INATIVO: 2
          IMPEDIDO: 1
    RelatoRequest:
      type: object
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 160
          example: Minha jornada
        conteudo:
          type: string
          minLength: 1
          maxLength: 10000
          example: Relato pessoal sobre recuperação.
        tags:
          type: array
          items:
            type: string
            maxLength: 40
          uniqueItems: true
          example:
          - recuperacao
          - apoio
      additionalProperties: false
      required:
      - titulo
      - conteudo
      example:
        titulo: Minha jornada
        conteudo: Relato pessoal sobre recuperação.
        tags:
        - recuperacao
        - apoio
    Relato:
      type: object
      properties:
        id:
          type: string
          example: r-5
        autorId:
          type: string
          example: u-31
        titulo:
          type: string
          example: Minha jornada
        conteudo:
          type: string
          example: Relato pessoal sobre recuperação.
        tags:
          type: array
          items:
            type: string
          example:
          - recuperacao
          - apoio
        criadoEm:
          type: string
          format: date-time
          example: '2026-10-01T12:00:00Z'
        atualizadoEm:
          type: string
          format: date-time
          example: '2026-10-01T12:00:00Z'
      additionalProperties: false
      required:
      - id
      - autorId
      - titulo
      - conteudo
      - tags
      - criadoEm
      example:
        id: r-5
        autorId: u-31
        titulo: Minha jornada
        conteudo: Relato pessoal sobre recuperação.
        tags:
        - recuperacao
        - apoio
        criadoEm: '2026-10-01T12:00:00Z'
    RelatoPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Relato'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
      additionalProperties: false
      required:
      - items
      - total
      - page
      - pageSize
      example:
        items:
        - id: r-5
          autorId: u-31
          titulo: Minha jornada
          conteudo: Relato pessoal sobre recuperação.
          tags:
          - recuperacao
          criadoEm: '2026-10-01T12:00:00Z'
        total: 1
        page: 1
        pageSize: 20
    GrupoRequest:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 120
          example: Roda de apoio de domingo
        descricao:
          type: string
          maxLength: 1000
          example: Encontro virtual de apoio mútuo.
        inicio:
          type: string
          format: date-time
          example: '2026-10-25T18:00:00Z'
        linkExterno:
          type: string
          format: uri
          example: https://meet.example.org/roda
        capacidadeMaxima:
          type: integer
          minimum: 2
          example: 20
      additionalProperties: false
