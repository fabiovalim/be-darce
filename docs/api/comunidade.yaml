              example:
                type: about:blank
                title: Requisição inválida
                status: 400
                detail: Dados ou parâmetros inválidos.
                instance: /v1/mentores/me
                code: VALIDATION_ERROR
        '403':
          description: O papel ou a relação com o recurso não autoriza a operação.
