openapi: 3.1.0
info:
  title: BEDARCE — Microsserviço de Gamificação
  version: 1.0.0
  description: Trilhas, etapas, conclusão, pontuação, níveis e orquestração da promoção a mentor. O comando de conclusão atualiza
    sincronicamente os pontos e o nível; as consultas de progresso usam o modelo de leitura, cuja defasagem projetada é de
    até 2 segundos. O Gateway pode responder 429 quando excede o rate limit; o BFF pode responder 503 quando uma dependência
    necessária fica indisponível, conforme a arquitetura descrita no README.
servers:
- url: /
  description: Origem configurada pelo ambiente para o microsserviço; os caminhos deste contrato incluem /v1.
tags:
- name: Trilhas
- name: Etapas
- name: Usuarios
- name: Estatisticas
- name: Promocoes Mentor
- name: Internal
paths:
  /v1/trilhas:
    get:
      tags:
      - Trilhas
      summary: Listar trilhas
      description: 'Acesso: Paciente e Administrador. Lista trilhas ativas, filtradas por público-alvo.'
      operationId: getV1Trilhas
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrilhaPage'
        '401':
          description: Token ausente, inválido ou expirado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Não autenticado
                status: 401
                detail: Token ausente, inválido ou expirado.
                instance: /v1/trilhas
                code: UNAUTHORIZED
      parameters:
      - name: publicoAlvo
        in: query
        required: false
        schema:
          type: string
        description: Filtra pelo público-alvo.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      x-bedarce-caller: bff-portal` e `bff-admin
    post:
      tags:
      - Trilhas
      summary: Criar trilha
      description: 'Acesso: Administrador. Cria uma trilha.'
      operationId: postV1Trilhas
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Recurso criado; URI no cabeçalho Location.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trilha'
          headers:
            Location:
              description: URI do recurso criado.
              schema:
                type: string
                format: uri-reference
                example: /v1/trilhas/t-1
        '401':
          description: Token ausente, inválido ou expirado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Não autenticado
                status: 401
                detail: Token ausente, inválido ou expirado.
                instance: /v1/trilhas
                code: UNAUTHORIZED
        '400':
          description: Dados ou parâmetros inválidos.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Requisição inválida
                status: 400
                detail: Dados ou parâmetros inválidos.
                instance: /v1/trilhas
                code: VALIDATION_ERROR
        '403':
          description: O papel ou a relação com o recurso não autoriza a operação.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Acesso negado
                status: 403
                detail: O papel ou a relação com o recurso não autoriza a operação.
                instance: /v1/trilhas
                code: FORBIDDEN
      parameters:
      - name: publicoAlvo
        in: query
        required: false
        schema:
