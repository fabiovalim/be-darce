        nome:
          type: string
          minLength: 1
          maxLength: 120
          example: Primeiros passos
        descricao:
          type: string
          maxLength: 1000
          example: Conteúdo introdutório de recuperação.
        publicoAlvo:
          type: array
          items:
            $ref: '#/components/schemas/PublicoAlvo'
          minItems: 1
          uniqueItems: true
          example:
          - PACIENTE
      additionalProperties: false
      required:
      - nome
      - descricao
      - publicoAlvo
      example:
        nome: Primeiros passos
        descricao: Conteúdo introdutório de recuperação.
        publicoAlvo:
        - PACIENTE
    EtapaResumo:
      type: object
      properties:
