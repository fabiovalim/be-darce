openapi: 3.1.0
info:
  title: BEDARCE — Microsserviço de Atendimento
  version: 1.0.0
  description: Perfis de psicólogos, publicações, disponibilidade, consultas e notas. Operações externas exigem token Bearer.
    Respostas de psicólogos e consultas incluem links HATEOAS calculados conforme estado e autorização. O Gateway pode responder
    429 quando excede o rate limit; o BFF pode responder 503 quando uma dependência necessária fica indisponível, conforme
    a arquitetura descrita no README.
servers:
- url: /
  description: Origem configurada pelo ambiente para o microsserviço; os caminhos deste contrato incluem /v1.
tags:
- name: Psicologos
- name: Publicacoes
- name: Consultas
- name: Pacientes
- name: Internal
paths:
  /v1/psicologos:
    get:
      tags:
      - Psicologos
      summary: Listar psicólogos
      description: 'Acesso: Logado e Administrador. Portal retorna apenas aprovados; administrador pode filtrar por situação.'
      operationId: getV1Psicologos
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PsicologoPage'
        '401':
          description: Token ausente, inválido ou expirado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Token ausente, inválido ou expirado.
                status: 401
                detail: Token ausente, inválido ou expirado.
                instance: /v1/psicologos
                code: UNAUTHORIZED
        '400':
          description: Dados ou parâmetros inválidos.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Dados ou parâmetros inválidos.
                status: 400
                detail: Dados ou parâmetros inválidos.
                instance: /v1/psicologos
                code: VALIDATION_ERROR
      security:
      - bearerAuth: []
      parameters:
      - name: nome
        in: query
        required: false
        schema:
          type: string
        description: Busca por nome, sem distinção entre maiúsculas e minúsculas.
      - name: precoMinimo
        in: query
        required: false
        schema:
          type: number
          minimum: 0
        description: Preço mínimo da consulta.
      - name: precoMaximo
        in: query
        required: false
        schema:
          type: number
          minimum: 0
        description: Preço máximo da consulta.
      - name: situacao
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDENTE
          - APROVADO
          - SUSPENSO
        description: Situação; filtro administrativo.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      x-bedarce-caller: bff-portal` e `bff-admin
  /v1/psicologos/{id}:
