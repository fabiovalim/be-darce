components:
  schemas:
    Error:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
          example: about:blank
        title:
          type: string
          example: Requisição inválida
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Um ou mais campos são inválidos.
        instance:
          type: string
          format: uri-reference
          example: /v1/recursos
        code:
          type: string
          example: VALIDATION_ERROR
      additionalProperties: false
      required:
      - type
      - title
      - status
      - detail
    Link:
      type: object
      properties:
        href:
          type: string
          format: uri-reference
          example: /v1/consultas/c-9f1c
        method:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - DELETE
          example: GET
      additionalProperties: false
      required:
      - href
      - method
    SituacaoPsicologo:
      type: string
      enum:
      - PENDENTE
      - APROVADO
      - SUSPENSO
      example: APROVADO
    StatusConsulta:
      type: string
      enum:
      - SOLICITADA
      - CONFIRMADA
      - CONCLUIDA
      - CANCELADA
      example: SOLICITADA
    Psicologo:
      type: object
      properties:
        id:
          type: string
          example: p-12
        usuarioId:
          type: string
          example: u-7
        nome:
          type: string
          example: Dra. Clara Silva
        apelido:
          type: string
          example: Clara
        descricao:
          type: string
          example: Atendimento acolhedor.
        abordagem:
          type: string
          example: Terapia Cognitivo-Comportamental
        valorConsulta:
          type: number
          format: double
          minimum: 0
          example: 180.0
        contato:
          type: string
          example: contato@example.com
        situacao:
          $ref: '#/components/schemas/SituacaoPsicologo'
        _links:
          type: object
          properties:
            self:
              $ref: '#/components/schemas/Link'
            publicacoes:
              $ref: '#/components/schemas/Link'
            horarios:
              $ref: '#/components/schemas/Link'
          additionalProperties: false
          required:
          - self
      additionalProperties: false
      required:
      - id
      - usuarioId
      - nome
      - apelido
      - descricao
      - abordagem
      - valorConsulta
      - situacao
      - _links
      - contato
      example:
        id: p-12
        usuarioId: u-7
        nome: Dra. Clara Silva
        apelido: Clara
        descricao: Atendimento acolhedor.
        abordagem: Terapia Cognitivo-Comportamental
        valorConsulta: 180.0
        situacao: APROVADO
        _links:
          self:
            href: /v1/psicologos/p-12
            method: GET
          publicacoes:
            href: /v1/psicologos/p-12/publicacoes
            method: GET
        contato: contato@example.com
    PsicologoPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Psicologo'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
      additionalProperties: false
      required:
      - items
      - total
      - page
      - pageSize
      example:
        items:
        - id: p-12
          usuarioId: u-7
          nome: Dra. Clara Silva
          apelido: Clara
          descricao: Atendimento acolhedor.
          abordagem: TCC
          valorConsulta: 180.0
          situacao: APROVADO
          _links:
