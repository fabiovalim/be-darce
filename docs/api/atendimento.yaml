      properties:
        horarios:
          type: array
          items:
            $ref: '#/components/schemas/FaixaHorario'
          minItems: 1
      additionalProperties: false
      required:
      - horarios
      example:
        horarios:
        - diaSemana: SEGUNDA
          inicio: 09:00
          fim: '17:00'
    HorarioLivre:
      type: object
      properties:
        inicio:
          type: string
          format: date-time
          example: '2026-10-25T14:00:00Z'
        fim:
          type: string
          format: date-time
          example: '2026-10-25T15:00:00Z'
      additionalProperties: false
      required:
      - inicio
      - fim
      example:
        inicio: '2026-10-25T14:00:00Z'
        fim: '2026-10-25T15:00:00Z'
    HorariosLivres:
      type: object
      properties:
        psicologoId:
          type: string
          example: p-12
        horarios:
          type: array
          items:
            $ref: '#/components/schemas/HorarioLivre'
      additionalProperties: false
      required:
      - psicologoId
      - horarios
      example:
        psicologoId: p-12
        horarios:
        - inicio: '2026-10-25T14:00:00Z'
          fim: '2026-10-25T15:00:00Z'
    AgendarConsultaRequest:
      type: object
      properties:
        psicologoId:
          type: string
          example: p-12
        pacienteId:
          type: string
          example: u-42
        observacao:
          type: string
          maxLength: 500
          example: Primeira consulta.
        data:
          type: string
          format: date-time
          example: '2026-10-25T14:00:00Z'
      additionalProperties: false
      required:
      - psicologoId
      - data
      example:
        psicologoId: p-12
        observacao: Primeira consulta.
        data: '2026-10-25T14:00:00Z'
    Consulta:
      type: object
      properties:
        id:
          type: string
          example: c-9f1c
        pacienteId:
          type: string
          example: u-42
        psicologoId:
          type: string
          example: p-12
        status:
          $ref: '#/components/schemas/StatusConsulta'
        observacao:
          type: string
          example: Primeira consulta.
        _links:
          type: object
          properties:
            self:
              $ref: '#/components/schemas/Link'
            psicologo:
              $ref: '#/components/schemas/Link'
            confirmar:
              $ref: '#/components/schemas/Link'
            cancelar:
              $ref: '#/components/schemas/Link'
          additionalProperties: false
          required:
          - self
        data:
          type: string
          format: date-time
          example: '2026-10-25T14:00:00Z'
      additionalProperties: false
      required:
      - id
      - pacienteId
      - psicologoId
      - status
      - data
      - _links
      example:
        id: c-9f1c
        pacienteId: u-42
        psicologoId: p-12
        status: SOLICITADA
        _links:
          self:
            href: /v1/consultas/c-9f1c
            method: GET
          psicologo:
            href: /v1/psicologos/p-12
            method: GET
          confirmar:
            href: /v1/consultas/c-9f1c/confirmacao
            method: POST
          cancelar:
            href: /v1/consultas/c-9f1c/cancelamento
            method: POST
        data: '2026-10-25T14:00:00Z'
    ConsultaPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Consulta'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
      additionalProperties: false
      required:
      - items
      - total
      - page
      - pageSize
      example:
        items:
        - id: c-9f1c
          pacienteId: u-42
          psicologoId: p-12
          status: SOLICITADA
          _links:
            self:
              href: /v1/consultas/c-9f1c
              method: GET
          data: '2026-10-25T14:00:00Z'
        total: 1
        page: 1
        pageSize: 20
    CancelamentoRequest:
      type: object
      properties:
        motivo:
          type: string
          maxLength: 500
          example: Imprevisto.
      additionalProperties: false
      example:
        motivo: Imprevisto.
    NotaRequest:
      type: object
      properties:
        conteudo:
          type: string
          minLength: 1
          maxLength: 5000
          example: Paciente relatou evolução no plano de recuperação.
      additionalProperties: false
      required:
      - conteudo
      example:
        conteudo: Paciente relatou evolução no plano de recuperação.
    Nota:
      type: object
      properties:
        id:
          type: string
          example: n-1
        consultaId:
          type: string
          example: c-9f1c
        pacienteId:
          type: string
          example: u-42
        psicologoId:
          type: string
          example: p-12
        conteudo:
          type: string
          example: Paciente relatou evolução no plano de recuperação.
        criadaEm:
          type: string
          format: date-time
          example: '2026-10-25T15:00:00Z'
      additionalProperties: false
      required:
      - id
      - consultaId
      - pacienteId
      - psicologoId
      - conteudo
      - criadaEm
      example:
        id: n-1
        consultaId: c-9f1c
        pacienteId: u-42
        psicologoId: p-12
        conteudo: Paciente relatou evolução no plano de recuperação.
        criadaEm: '2026-10-25T15:00:00Z'
    NotaPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Nota'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
      additionalProperties: false
      required:
      - items
      - total
      - page
      - pageSize
      example:
        items:
        - id: n-1
          consultaId: c-9f1c
          pacienteId: u-42
          psicologoId: p-12
          conteudo: Paciente relatou evolução.
          criadaEm: '2026-10-25T15:00:00Z'
        total: 1
        page: 1
        pageSize: 20
